[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtrade"
version = "0.1.0"
description = "A-share quantitative research and backtesting platform"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "akshare>=1.12",
    "click>=8.1",
    "matplotlib>=3.8",
    "mplfinance>=0.12",
    "seaborn>=0.13",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gbdt = ["lightgbm>=4.0"]
dev = ["pytest>=8.0", "pytest-cov", "black", "ruff", "mypy"]

[project.scripts]
realtrade = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
